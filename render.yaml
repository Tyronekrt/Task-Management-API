services:
  - type: web
    name: task-management-api
    env: php
    plan: free
    autoDeploy: true
    root: laravel-app
    buildCommand: composer install --no-dev --prefer-dist --optimize-autoloader
    startCommand: php artisan migrate --force && php artisan serve --host=0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "<DB_HOST>"
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: "<DB_DATABASE>"
      - key: DB_USERNAME
        value: "<DB_USERNAME>"
      - key: DB_PASSWORD
        value: "<DB_PASSWORD>"
    healthCheckPath: /api/tasks
